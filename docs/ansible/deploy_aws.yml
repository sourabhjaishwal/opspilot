---
- name: Deploy OpsPilot to AWS EC2
  hosts: aws_ec2
  become: true
  gather_facts: false
  vars_files:
    - vars/production.yml

  pre_tasks:
    - name: Verify Python is available
      ansible.builtin.command:
        cmd: python3 --version
      changed_when: false

    - name: Verify Docker is available
      ansible.builtin.command:
        cmd: docker --version
      changed_when: false

    - name: Verify outbound host network access
      ansible.builtin.uri:
        url: https://registry-1.docker.io/v2/
        method: GET
        status_code: [200, 401]
        return_content: false

  roles:
    - role: opspilot_deploy
      vars:
        opspilot_image: "{{ CONTAINER_IMAGE }}"
        opspilot_container_name: opspilot-api
        opspilot_volume_name: "{{ PERSISTENT_VOLUME }}"
        opspilot_host_port: "{{ APP_PORT }}"
        opspilot_container_port: "{{ APP_PORT }}"
        opspilot_health_url: "http://127.0.0.1:{{ APP_PORT }}/health"
        opspilot_environment:
          LOG_LEVEL: "{{ LOG_LEVEL }}"
          ENVIRONMENT: "{{ ENVIRONMENT }}"

  post_tasks:
    - name: Wait for the public application port to open
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ APP_PORT }}"
        state: started
        timeout: 60
      delegate_to: localhost
      become: false

    - name: Verify the public health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ APP_PORT }}/health"
        method: GET
        status_code: 200
        return_content: false
      delegate_to: localhost
      become: false
