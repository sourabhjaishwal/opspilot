---
# OpsPilot Deployment Playbook
# Deploys the OpsPilot application from AWS ECR to EC2.

- name: Deploy OpsPilot AWS EC2
  hosts: opspilot
  become: true

  vars:
    aws_region: "ap-south-1"
    ecr_registry: "547585703105.dkr.ecr.ap-south-1.amazonaws.com"
    ecr_repository: "opspilot"
    ecr_image: "{{ ecr_registry }}/{{ ecr_repository }}:latest"
    data_volume: "opspilot-data"
    container_name: "opspilot"
    app_port: 8000

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-venv
          - awscli
        state: present

    - name: Install Docker using official Docker installation script
      ansible.builtin.shell:
        cmd: curl -fsSL https://get.docker.com | sh
        creates: /usr/bin/docker

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create Ansible Docker SDK virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/ansible-venv
        creates: /opt/ansible-venv/bin/python

    - name: Install Docker Python SDK
      ansible.builtin.command:
        cmd: /opt/ansible-venv/bin/pip install docker
      register: docker_sdk_install
      changed_when: "'Successfully installed' in docker_sdk_install.stdout"

    - name: Create persistent Docker volume
      community.docker.docker_volume:
        name: "{{ data_volume }}"
        state: present

    - name: Authenticate Docker to Amazon ECR
      ansible.builtin.shell:
        cmd: |
          aws ecr get-login-password --region {{ aws_region }} |
          docker login --username AWS --password-stdin {{ ecr_registry }}
      no_log: true
      changed_when: false

    - name: Pull OpsPilot image from ECR
      community.docker.docker_image:
        name: "{{ ecr_image }}"
        source: pull

    - name: Stop existing OpsPilot container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      failed_when: false

    - name: Remove existing OpsPilot container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Read application environment file
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../backend/.env"
      delegate_to: localhost
      become: false
      register: app_env_file

    - name: Create application configuration directory
      ansible.builtin.file:
        path: /opt/opspilot
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install application environment file
      ansible.builtin.copy:
        content: "{{ app_env_file.content | b64decode }}"
        dest: /opt/opspilot/.env
        owner: root
        group: root
        mode: "0600"

    - name: Deploy OpsPilot container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ ecr_image }}"
        state: started
        restart_policy: unless-stopped
        recreate: true
        published_ports:
          - "{{ app_port }}:{{ app_port }}"
        volumes:
          - "{{ data_volume }}:/app/data"
        env_file: "/opt/opspilot/.env"
        healthcheck:
          test:
            - CMD
            - curl
            - "-f"
            - "http://localhost:8000/health"
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 10s

    - name: Display deployment success message
      ansible.builtin.debug:
        msg: "OpsPilot ECR deployment completed successfully."
