name: OpsPilot AWS Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: aws-demo
        type: choice
        options:
          - aws-demo

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --tb=short
        env:
          APP_NAME: OpsPilot CI
          ENVIRONMENT: test
          DATABASE_URL: sqlite://
          LOG_LEVEL: INFO
          JWT_SECRET: ci-only-test-secret
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          ALLOWED_ORIGINS: http://localhost
          FRONTEND_URL: http://localhost
          GEMINI_MODEL: gemini-2.0-flash-exp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: opspilot-github-actions-${{ github.run_id }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/opspilot-key.pem
          chmod 600 ~/.ssh/opspilot-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Create temporary Ansible inventory
        run: |
          cat > /tmp/opspilot-inventory.ini <<EOF
          [opspilot]
          opspilot-ec2 ansible_host=$EC2_HOST ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/opspilot-key.pem

          [opspilot:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Install Ansible
        run: |
          python -m pip install ansible docker

      - name: Run Ansible playbook
        run: |
          cd ansible
          ansible-playbook -i /tmp/opspilot-inventory.ini \
            -e "image_tag=${IMAGE_TAG}" \
            -e "ecr_registry=${ECR_REGISTRY}" \
            -e "ecr_repository=${ECR_REPOSITORY}" \
            deploy.yml
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          APP_NAME: ${{ secrets.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
          DATABASE_URL: sqlite:///./data/opspilot.db
          LOG_LEVEL: INFO
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
