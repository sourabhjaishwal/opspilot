name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: opspilot
  DOCKER_TAG: ${{ github.sha }}

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --tb=short

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, build-frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }},${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/opspilot-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/opspilot-image.tar
          retention-days: 7

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/opspilot-image.tar

      - name: Save Docker image for transfer
        run: docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > /tmp/opspilot-latest.tar.gz

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          pip install ansible docker

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/opspilot-key.pem
          chmod 600 ~/.ssh/opspilot-key.pem

      - name: Create Ansible inventory from secrets
        run: |
          cat > ansible/inventory.ini << EOF
          [opspilot]
          opspilot-ec2 ansible_host=${{ secrets.EC2_HOST }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/opspilot-key.pem

          [opspilot:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Transfer Docker image to EC2
        run: |
          scp -i ~/.ssh/opspilot-key.pem -o StrictHostKeyChecking=no \
            /tmp/opspilot-latest.tar.gz ubuntu@${{ secrets.EC2_HOST }}:/tmp/

      - name: Load Docker image on EC2
        run: |
          ssh -i ~/.ssh/opspilot-key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} \
            "gunzip -c /tmp/opspilot-latest.tar.gz | docker load"

      - name: Deploy with Ansible
        run: |
          cd ansible
          ansible-playbook -i inventory.ini deploy.yml
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          ENVIRONMENT: production
          DATABASE_URL: sqlite:///./data/opspilot.db
          LOG_LEVEL: INFO
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash-exp

      - name: Verify deployment
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8000/health || exit 1
          echo "✅ Deployment successful! OpsPilot is healthy."

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/opspilot-key.pem
          rm -f /tmp/opspilot-latest.tar.gz
